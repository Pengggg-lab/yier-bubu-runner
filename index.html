<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101728">
<title>一二布布跑酷</title>
<style>
  :root{
    --cream:#fffaf1;
    --pink:#f6b3ae;
    --gold:#ffcf5c;
    --dark:#3b2727;
    --brown:#c99b87;
    --ink:#172033;
    --panel:rgba(16,23,40,.82);
    --stroke:rgba(255,255,255,.14);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:#9cdef7}
  body{
    font-family:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:#fff;
    overscroll-behavior:none;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }
  #app{
    position:fixed;inset:0;
    background:linear-gradient(180deg,#6cc9f7 0%,#a8e7ff 34%,#d7f6e2 52%,#a9dc83 72%,#72bc4f 100%);
    overflow:hidden;
  }
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .hidden{display:none!important}
  .fade{transition:opacity .25s ease}
  button{font-family:inherit;border:0;cursor:pointer;color:inherit;background:none}

  /* ---------- 主菜单 ---------- */
  #menu{padding:calc(var(--safe-t) + 22px) 18px calc(var(--safe-b) + 16px)}
  #menu::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 38%,transparent 24%,rgba(19,52,40,.10) 62%,rgba(10,35,35,.50) 100%);
  }
  .menu-top{position:relative;text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.45)}
  .menu-top h1{
    margin:0;font-size:clamp(28px,8.4vw,40px);letter-spacing:.06em;font-weight:900;
    background:linear-gradient(180deg,#fffdf6 30%,#ffd98f);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(59,39,39,.55));
  }
  .menu-top .sub{margin:8px 0 0;font-size:13px;letter-spacing:.2em;color:#3f562c;text-shadow:0 1px 0 rgba(255,255,255,.72)}
  .menu-bottom{position:relative;display:flex;flex-direction:column;gap:10px}
  .best{
    align-self:center;font-size:12px;color:#ffe7c2;opacity:.9;
    background:rgba(10,15,30,.5);border:1px solid var(--stroke);
    padding:5px 14px;border-radius:999px;backdrop-filter:blur(8px);
  }
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{
    pointer-events:auto;display:flex;align-items:center;gap:10px;text-align:left;
    padding:12px 12px;border-radius:18px;
    background:rgba(16,23,40,.78);border:2px solid rgba(255,255,255,.12);
    transition:transform .16s ease,border-color .16s ease,background .16s ease;
    backdrop-filter:blur(10px);
  }
  .card:active{transform:scale(.97)}
  .card.selected{border-color:var(--gold);background:rgba(50,40,34,.86);box-shadow:0 0 0 3px rgba(255,207,92,.18),0 10px 30px rgba(0,0,0,.3)}
  .card b{display:block;font-size:16px;letter-spacing:.08em}
  .card small{display:block;margin-top:3px;font-size:10.5px;color:#cfd6e8;opacity:.85;white-space:nowrap}
  .avatar{
    position:relative;flex:0 0 46px;height:46px;border-radius:50%;
    background:var(--fur);border:2.5px solid var(--dark);
    box-shadow:inset -4px -5px 0 rgba(0,0,0,.06);
  }
  .avatar::before,.avatar::after{
    content:"";position:absolute;top:-7px;width:16px;height:16px;border-radius:50%;
    background:var(--ear);border:2.5px solid var(--dark);
  }
  .avatar::before{left:1px}
  .avatar::after{right:1px}
  .avatar i{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 31% 47%,var(--dark) 2.4px,transparent 3px),
      radial-gradient(circle at 69% 47%,var(--dark) 2.4px,transparent 3px),
      radial-gradient(circle at 21% 64%,var(--blush) 5.5px,transparent 6px),
      radial-gradient(circle at 79% 64%,var(--blush) 5.5px,transparent 6px);
  }
  .avatar.yier{--fur:#fffaf1;--ear:#3b2727;--blush:#f6b3ae}
  .avatar.bubu{--fur:#c99b87;--ear:#5a3a31;--blush:#f6ca93}
  .primary{
    pointer-events:auto;width:100%;padding:16px 18px;border-radius:999px;
    font-size:17px;font-weight:800;letter-spacing:.12em;color:#43260f;
    background:linear-gradient(180deg,#ffe6a1,#ffc44d);
    box-shadow:0 8px 0 #a56a1f,0 14px 30px rgba(0,0,0,.35);
    transition:transform .12s ease,filter .15s ease;
  }
  .primary:active{transform:translateY(4px);box-shadow:0 4px 0 #a56a1f,0 8px 20px rgba(0,0,0,.3)}
  .primary:disabled{filter:grayscale(.65) brightness(.8);box-shadow:0 6px 0 rgba(0,0,0,.35);color:#5b5146}
  .menu-tip{margin:0;text-align:center;font-size:11.5px;color:#3f4a2c;opacity:.95;letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,255,255,.65)}

  /* ---------- HUD ---------- */
  #hud{pointer-events:none}
  .hud-top{
    position:absolute;left:0;right:0;top:0;
    padding:calc(var(--safe-t) + 10px) 12px 0;
    display:flex;align-items:center;gap:8px;
  }
  .pill{
    display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    background:rgba(12,18,34,.62);border:1px solid var(--stroke);
    backdrop-filter:blur(8px);font-size:13px;font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
  }
  .stars{letter-spacing:2px;font-size:17px;color:var(--gold);text-shadow:0 0 10px rgba(255,207,92,.45)}
  .stars .off{color:rgba(255,255,255,.18);text-shadow:none}
  .hud-sub{
    position:absolute;left:12px;top:calc(var(--safe-t) + 56px);
    display:flex;align-items:center;gap:7px;
  }
  .hud-sub .pill{padding:5px 11px;font-size:12px}
  .hud-sub .unit{font-style:normal;font-size:10px;color:#c8d0e2;margin-left:3px}
  .coin-pill{color:#ffe39a}
  .coin-dot{
    width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#f5bc3b 60%,#c98a1f);
    border:1.5px solid #8d5c14;display:inline-block;position:relative;
  }
  .coin-dot::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid rgba(141,92,20,.75)}
  .icon-btn{
    pointer-events:auto;width:40px;height:40px;border-radius:14px;
    background:rgba(12,18,34,.62);border:1px solid var(--stroke);
    font-size:16px;display:grid;place-items:center;backdrop-filter:blur(8px);
  }
  .icon-btn:active{transform:scale(.94)}
  .timer-wrap{
    flex:1;min-width:0;display:flex;align-items:center;gap:7px;
  }
  .timer-bar{flex:1;height:8px;border-radius:999px;background:rgba(255,255,255,.42);overflow:hidden;border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 2px rgba(20,50,30,.12)}
  .timer-bar i{display:block;height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,#8dffcf,#ffd45c 70%,#ff8b6b);transition:width .2s linear}
  #timeText{font-size:12px;font-weight:800;color:#ffe9bf;min-width:44px;text-align:right;text-shadow:0 2px 6px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
  #toast{
    position:absolute;left:50%;top:22%;transform:translate(-50%,-8px);
    padding:10px 18px;border-radius:999px;background:rgba(10,15,30,.68);
    border:1px solid var(--stroke);font-size:12.5px;letter-spacing:.08em;color:#ffe9c4;
    opacity:0;transition:opacity .35s ease,transform .35s ease;white-space:nowrap;
    backdrop-filter:blur(8px);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #muteBtn{position:absolute;right:12px;bottom:calc(var(--safe-b) + 12px)}
  #flash{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(255,70,60,.55));opacity:0;pointer-events:none;transition:opacity .18s}
  #flash.on{opacity:1;transition:opacity .04s}
  /* ---------- 通用弹层 ---------- */
  .overlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    padding:calc(var(--safe-t) + 16px) 18px calc(var(--safe-b) + 16px);
    background:rgba(5,9,20,.62);backdrop-filter:blur(6px);pointer-events:auto;
    animation:fadeIn .22s ease;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .panel{
    width:min(100%,400px);border-radius:26px;padding:20px;
    background:linear-gradient(180deg,rgba(30,40,66,.96),rgba(16,23,40,.97));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 24px 70px rgba(0,0,0,.55);
    text-align:center;
  }
  .panel h2{margin:0;font-size:21px;letter-spacing:.08em}
  .panel p{margin:8px 0 0;font-size:12.5px;line-height:1.65;color:#c8d0e2}
  .panel .primary{margin-top:18px}
  .ghost{
    pointer-events:auto;margin-top:10px;width:100%;padding:13px;border-radius:999px;
    border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);
    font-size:14px;font-weight:700;color:#e8edf8;
  }
  .ghost:active{background:rgba(255,255,255,.12)}

  /* 暂停 */
  #pause .panel{padding-top:24px}
  .pause-title{font-size:20px;font-weight:900;letter-spacing:.16em}

  /* 复活 */
  #revive .panel{padding:16px;width:min(100%,380px)}
  #revive h2{font-size:19px;color:#ffe7a6}
  .revive-choice{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .revive-choice .primary{margin-top:0}
  .revive-progress{margin:10px 0 0!important;font-size:12px;color:#ffe2a0;font-weight:700}
  .video-wrap{
    position:relative;margin:12px auto 4px;width:100%;max-width:250px;
    aspect-ratio:9/16;max-height:46vh;border-radius:18px;overflow:hidden;
    background:#000;border:1px solid rgba(255,255,255,.18);
  }
  #reviveVideo{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .video-hint{
    position:absolute;left:8px;bottom:8px;padding:4px 9px;border-radius:999px;
    background:rgba(0,0,0,.55);font-size:10px;color:#fff;pointer-events:none;
  }
  #reviveContinue{margin-top:12px}
  .revive-note{font-size:11px;color:#aab4c8;margin-top:8px!important}

  /* 结算 */
  #over .panel{width:min(100%,380px)}
  .result-badge{
    display:inline-block;padding:5px 14px;border-radius:999px;font-size:11px;letter-spacing:.16em;
    background:rgba(255,207,92,.14);border:1px solid rgba(255,207,92,.35);color:#ffdf95;margin-bottom:10px;
  }
  #overTitle{font-size:26px;letter-spacing:.1em}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
  .stat-box{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:11px 8px}
  .stat-box b{display:block;font-size:19px;color:#ffe6a8;font-variant-numeric:tabular-nums}
  .stat-box span{display:block;margin-top:3px;font-size:10.5px;color:#aeb8cc;letter-spacing:.08em}
  .over-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .over-btns .primary{margin-top:0;padding:14px 8px;font-size:15px}
  .over-btns .ghost{margin-top:0;padding:14px 8px;font-size:14px}
  .over-btns .ghost:first-child{grid-column:auto}

  @media (orientation:landscape) and (max-height:520px){
    .menu-bottom{flex-direction:row;align-items:center;flex-wrap:wrap}
    .cards{flex:1.2;min-width:300px}
    .primary{flex:1;min-width:180px}
    .best{display:none}
    #menu{padding-top:calc(var(--safe-t) + 8px)}
    .menu-top h1{font-size:24px}
    .menu-top .sub{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="menu" class="screen">
    <div class="menu-top">
      <h1>一二布布跑酷</h1>
      <p class="sub">森林轨道 · 10 分钟挑战</p>
    </div>
    <div class="menu-bottom">
      <div class="best">最高分 <span id="bestScore">0</span></div>
      <div class="cards">
        <button class="card" data-char="yier">
          <span class="avatar yier"><i></i></span>
          <span><b>一二</b><small>奶白熊猫</small></span>
        </button>
        <button class="card" data-char="bubu">
          <span class="avatar bubu"><i></i></span>
          <span><b>布布</b><small>棕色小熊</small></span>
        </button>
      </div>
      <button id="startBtn" class="primary" disabled>先选一个伙伴</button>
      <p class="menu-tip">上滑跳跃 · 下滑翻滚 · 左右换道</p>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="pill stars" id="stars">★★★★★</div>
      <div class="timer-wrap">
        <div class="timer-bar"><i id="timeFill"></i></div>
        <span id="timeText">10:00</span>
      </div>
      <button id="pauseBtn" class="icon-btn" aria-label="暂停">Ⅱ</button>
    </div>
    <div class="hud-sub">
      <div class="pill coin-pill"><span class="coin-dot"></span><span id="coinCount">0</span></div>
      <div class="pill"><span id="scoreVal">0</span><em class="unit">分</em></div>
    </div>
    <div id="toast">上滑跳跃 · 下滑翻滚 · 左右换道</div>
    <button id="muteBtn" class="icon-btn" aria-label="声音">🔊</button>
    <div id="flash"></div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel">
      <div class="pause-title">暂停中</div>
      <p>喘口气，看看前方轨道。</p>
      <button id="resumeBtn" class="primary">继续跑</button>
      <button id="restartBtn" class="ghost">重新开始</button>
    </div>
  </div>

  <div id="revive" class="overlay hidden">
    <div class="panel">
      <h2 id="reviveTitle">星星用完了</h2>
      <p id="reviveDesc">看布布跳舞 3 遍可以复活，也可以直接结算。</p>
      <div id="reviveChoice" class="revive-choice">
        <button id="watchReviveBtn" class="primary">看布布跳舞复活</button>
        <button id="skipReviveBtn" class="ghost">跳过，直接结算</button>
      </div>
      <div id="revivePlay" class="hidden">
        <div class="video-wrap">
          <video id="reviveVideo" playsinline webkit-playsinline preload="auto" muted></video>
          <span class="video-hint">轻触视频开声音</span>
        </div>
        <p id="reviveProgress" class="revive-progress">第 1/3 遍播放中…</p>
        <button id="reviveContinue" class="primary hidden">继续跑！</button>
      </div>
      <p class="revive-note">完整看完 3 遍才能复活；复活后再撞到障碍，本局立即结束</p>
    </div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="panel">
      <span class="result-badge" id="overBadge">本局结束</span>
      <h2 id="overTitle">差一点点</h2>
      <p id="overSub">再来一次，冲过十分钟。</p>
      <div class="stats">
        <div class="stat-box"><b id="endScore">0</b><span>得分</span></div>
        <div class="stat-box"><b id="endCoins">0</b><span>金币</span></div>
        <div class="stat-box"><b id="endDist">0 m</b><span>距离</span></div>
        <div class="stat-box"><b id="endTime">0:00</b><span>用时</span></div>
      </div>
      <div class="over-btns">
        <button id="againBtn" class="primary">再跑一次</button>
        <button id="menuBtn" class="ghost">换个角色</button>
      </div>
    </div>
  </div>
</div>

var bgm = new Audio();

var audioCtx = null;

function initAudio(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC){ try{ audioCtx = new AC(); }catch(e){} }
  }
  if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}
function tone(freq, dur, type, gain, delay, slideTo){
  if(muted || !audioCtx) return;
  var t0 = audioCtx.currentTime + (delay || 0);
  var osc = audioCtx.createOscillator();
  var g = audioCtx.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if(slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain || 0.12, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxJump(){ initAudio(); tone(340,0.16,"triangle",0.10,0,700); }
function sfxRoll(){ initAudio(); tone(300,0.13,"sine",0.07,0,170); }
function sfxCoin(){ initAudio(); tone(980,0.08,"sine",0.11,0); tone(1480,0.1,"sine",0.09,0.06); }
function sfxHit(){ initAudio(); tone(150,0.28,"sawtooth",0.13,0,58); tone(90,0.3,"square",0.07,0.02,48); }
function sfxWin(){ initAudio(); var n=[523,659,784,1047]; for(var i=0;i<n.length;i++) tone(n[i],0.22,"triangle",0.10,i*0.12); }
function sfxRevive(){ initAudio(); var n=[659,784,988,1319]; for(var i=0;i<n.length;i++) tone(n[i],0.2,"sine",0.09,i*0.1); }

function canvasTexture(w,h,draw){
  var cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  draw(cv.getContext("2d"), w, h);
  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
var stripeTex = canvasTexture(128,64,function(g,w,h){
  g.fillStyle = "#ffcf5c"; g.fillRect(0,0,w,h);
  g.fillStyle = "#3b2727";
  for(var x=-64;x<w+64;x+=32){
    g.beginPath(); g.moveTo(x,0); g.lineTo(x+16,0); g.lineTo(x+16-32,h); g.lineTo(x-32,h); g.closePath(); g.fill();
  }
});
var containerTex = canvasTexture(256,256,function(g,w,h){
  g.fillStyle = "#4d8f8a"; g.fillRect(0,0,w,h);
  g.strokeStyle = "rgba(255,255,255,.22)"; g.lineWidth = 10; g.strokeRect(7,7,w-14,h-14);
  g.fillStyle = "rgba(0,0,0,.12)";
  for(var i=0;i<7;i++){ g.fillRect(0, 40+i*26, w, 2); }
  g.fillStyle = "#fff8e8";
  g.beginPath();
  g.moveTo(w/2,86); g.bezierCurveTo(w/2-46,54,w/2-72,86,w/2,134);
  g.bezierCurveTo(w/2+72,86,w/2+46,54,w/2,86); g.fill();
  g.fillStyle = "#3b2727"; g.fillRect(0,h-34,w,34);
  for(var x2=0;x2<w;x2+=28){
    g.fillStyle = "#ffcf5c"; g.beginPath(); g.moveTo(x2,h); g.lineTo(x2+14,h-34); g.lineTo(x2+28,h-34); g.lineTo(x2+14,h); g.fill();
  }
});
containerTex.wrapS = containerTex.wrapT = THREE.RepeatWrapping;
var grassTex = canvasTexture(256,256,function(g,w,h){
  g.fillStyle = "#78bf53"; g.fillRect(0,0,w,h);
  for(var i=0;i<900;i++){
    var x = Math.random()*w, y = Math.random()*h;
    var shade = Math.random();
    g.fillStyle = shade>0.66 ? "#8ed166" : (shade>0.3 ? "#6db04a" : "#a1dc74");
    g.globalAlpha = 0.5 + Math.random()*0.35;
    g.fillRect(x,y,1.5+Math.random()*2.5,3+Math.random()*5);
  }
  g.globalAlpha = 1;
});
grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
grassTex.repeat.set(10,16);
var cloudTex = canvasTexture(256,128,function(g,w,h){
  g.clearRect(0,0,w,h);
  g.fillStyle = "rgba(255,255,255,.96)";
  var blobs = [[70,72,44],[112,56,54],[158,68,46],[198,82,30],[48,88,28],[130,92,40]];
  blobs.forEach(function(b){
    g.beginPath(); g.arc(b[0],b[1],b[2],0,Math.PI*2); g.fill();
  });
});
var glowTex = canvasTexture(128,128,function(g,w,h){
  var rg = g.createRadialGradient(w/2,h/2,2,w/2,h/2,w/2);
  rg.addColorStop(0,"rgba(255,238,196,.95)");
  rg.addColorStop(.35,"rgba(255,196,120,.42)");
  rg.addColorStop(1,"rgba(255,170,90,0)");
  g.fillStyle = rg; g.fillRect(0,0,w,h);
});

function refreshFence(){
  var d = env.dummy;
  env.fenceData.forEach(function(f,i){
    d.position.set(f.x,0.42,f.z);
    d.scale.set(1,1,1);
    d.rotation.set(0,0,0);
    d.updateMatrix();
    env.fenceInst.setMatrixAt(i,d.matrix);
  });
  env.fenceInst.instanceMatrix.needsUpdate = true;
}

function refreshTrees(){
  var d = env.dummy;

    d.rotation.set(0,0,0);
    d.position.set(t.x,0.75*t.s,t.z); d.scale.set(t.s,t.s,t.s); d.updateMatrix();
    env.trunkInst.setMatrixAt(i,d.matrix);
    d.position.set(t.x,1.72*t.s,t.z); d.scale.set(1.22*t.s,1.15*t.s,1.22*t.s); d.updateMatrix();

    env.canopyB.setMatrixAt(i,d.matrix);

  env.trunkInst.instanceMatrix.needsUpdate = true;

var LANES = [-1.55,0,1.55];
var BEAR_SCALE = 1;

function makeBear(cfg){
  var furMat = new THREE.MeshLambertMaterial({color:cfg.fur, emissive:cfg.emissive||0x000000});
  var darkMat = new THREE.MeshLambertMaterial({color:cfg.dark});
  var eyeMat = new THREE.MeshBasicMaterial({color:0x2a1c1c});
  var blushMat = new THREE.MeshBasicMaterial({color:cfg.blush, transparent:true, opacity:0.95});
  var whiteMat = new THREE.MeshBasicMaterial({color:0xffffff});
  var outlineMat = new THREE.MeshBasicMaterial({color:0x3b2727, side:THREE.BackSide});

  function outline(mesh,s){
    var o = new THREE.Mesh(mesh.geometry, outlineMat);
    o.scale.setScalar(s);
    mesh.add(o);
    return o;
  }

  var root = new THREE.Group();
  var pivot = new THREE.Group();
  pivot.position.y = 1.0;
  root.add(pivot);
  var model = new THREE.Group();
  model.position.y = -1.0;
  model.scale.setScalar(BEAR_SCALE);
  pivot.add(model);

  var body = new THREE.Mesh(new THREE.SphereGeometry(1,28,20), furMat);
  body.scale.set(0.62,0.72,0.55);
  body.position.y = 0.8;
  outline(body,1.045);
  model.add(body);

  var head = new THREE.Mesh(new THREE.SphereGeometry(1,32,24), furMat);
  head.scale.set(1,0.95,0.9);
  head.position.y = 1.95;
  outline(head,1.055);
  model.add(head);

  for(var e=-1;e<=1;e+=2){
    var ear = new THREE.Mesh(new THREE.SphereGeometry(0.26,18,14), cfg.earSame?furMat:darkMat);
    ear.scale.set(1,1,0.7);
    ear.position.set(e*0.64,2.7,-0.02);
    outline(ear,1.07);
    model.add(ear);
    if(cfg.earSame){
      var inner = new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12), darkMat);
      inner.scale.set(1,1,0.5);
      inner.position.set(e*0.64,2.7,0.2);
      model.add(inner);
    }
  }

  for(var s=-1;s<=1;s+=2){
    var eye = new THREE.Mesh(new THREE.SphereGeometry(0.105,14,12), eyeMat);
    eye.position.set(s*0.33,1.95,0.82);
    model.add(eye);
    var glint = new THREE.Mesh(new THREE.SphereGeometry(0.032,8,6), whiteMat);
    glint.position.set(s*0.33-0.035,2.0,0.91);
    model.add(glint);

    var brow = new THREE.Mesh(new THREE.BoxGeometry(0.23,0.05,0.05), darkMat);
    brow.position.set(s*0.3,2.17,0.83);
    brow.rotation.z = s*0.24;
    model.add(brow);

    var blush = new THREE.Mesh(new THREE.SphereGeometry(0.15,16,12), blushMat);
    blush.scale.set(1,0.88,0.28);
    blush.position.set(s*0.5,1.79,0.745);
    model.add(blush);
  }

  var mouthPts = [
    new THREE.Vector3(-0.12,1.83,0.87),
    new THREE.Vector3(-0.06,1.78,0.885),
    new THREE.Vector3(0,1.83,0.89),
    new THREE.Vector3(0.06,1.78,0.885),
    new THREE.Vector3(0.12,1.83,0.87)
  ];
  var mouth = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(mouthPts),16,0.017,6,false), darkMat);
  model.add(mouth);

  var armL = new THREE.Group(), armR = new THREE.Group();
  [-1,1].forEach(function(side){
    var arm = new THREE.Group();
    arm.position.set(side*0.61,1.14,0.02);
    var limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.12,0.22,6,12), furMat);
    limb.position.y = -0.12;
    limb.rotation.z = side*0.32;
    outline(limb,1.06);
    arm.add(limb);
    model.add(arm);
    if(side<0) armL=arm; else armR=arm;
  });

  var legL = new THREE.Group(), legR = new THREE.Group();
  [-1,1].forEach(function(side){
    var leg = new THREE.Group();
    leg.position.set(side*0.27,0.3,0.03);
    var limb = new THREE.Mesh(new THREE.CapsuleGeometry(0.155,0.16,6,12), furMat);
    limb.position.y = -0.1;
    outline(limb,1.06);
    leg.add(limb);
    if(cfg.darkFeet){
      var foot = new THREE.Mesh(new THREE.SphereGeometry(0.175,14,10), darkMat);
      foot.scale.set(1,0.62,1.25);
      foot.position.set(0,-0.21,0.05);
      leg.add(foot);
    }
    model.add(leg);
    if(side<0) legL=leg; else legR=leg;
  });

  if(cfg.bowtie){
    var bow = new THREE.Group();
    [-1,1].forEach(function(side){
      var wing = new THREE.Mesh(new THREE.SphereGeometry(0.112,12,10), darkMat);
      wing.scale.set(1.3,0.82,0.4);
      wing.position.x = side*0.11;
      wing.rotation.z = side*0.3;
      bow.add(wing);

  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.015;
  root.add(shadow);

  return { root:root, pivot:pivot, model:model, parts:{armL:armL,armR:armR,legL:legL,legR:legR}, shadow:shadow, cfg:cfg };
}

var spriteTex = {};
function prepareSprites(){
  var loader = new THREE.TextureLoader();
  Object.keys(SPRITE_SRC).forEach(function(k){
    var tex = loader.load(SPRITE_SRC[k]);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    spriteTex[k] = tex;
  });
}

function makeBearSprite(cfg){
  var H = 2.15;
  var root = new THREE.Group();
  var pivot = new THREE.Group();
  var model = new THREE.Group();
  pivot.position.y = H/2;
  model.position.y = 0;
  pivot.add(model);
  root.add(pivot);

  var plane = new THREE.PlaneGeometry(1,1,24,32);
  var legUniforms = {uSwing:{value:0}, uTuck:{value:0}};
  function spriteMat(key){
    var mat = new THREE.MeshBasicMaterial({
      map:spriteTex[key],
      transparent:true,
      alphaTest:0.12,
      depthWrite:true,
      side:THREE.DoubleSide
    });
    mat.onBeforeCompile = function(shader){
      shader.uniforms.uSwing = legUniforms.uSwing;
      shader.uniforms.uTuck = legUniforms.uTuck;
      shader.vertexShader = "uniform float uSwing;\nuniform float uTuck;\n" + shader.vertexShader;
      shader.vertexShader = shader.vertexShader.replace(
        "#include <begin_vertex>",
        [
          "#include <begin_vertex>",
          "float legT = clamp((-transformed.y - 0.16) / 0.30, 0.0, 1.0);",
          "float legSide = smoothstep(0.015, 0.16, abs(transformed.x));",
          "float legW = legT * legSide;",
          "float sgn = transformed.x < 0.0 ? -1.0 : 1.0;",
          "transformed.y += legW * (uSwing * sgn * 0.06 + uTuck * 0.06);",
          "transformed.x += legW * sgn * (abs(uSwing) * 0.02 + uTuck * 0.022);"
        ].join("\n")
      );
    };
    mat.customProgramCacheKey = function(){ return "bearLegs"; };
    return mat;
  }
  var front = new THREE.Mesh(plane, spriteMat(cfg.front));
  front.scale.set(H*cfg.fa,H,1);
  var back = new THREE.Mesh(plane, spriteMat(cfg.back));
  back.scale.set(H*cfg.ba,H,1);
  back.visible = false;
  model.add(front);
  model.add(back);

  var shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.62,24),
    new THREE.MeshBasicMaterial({color:0x2f4a22, transparent:true, opacity:0.28, depthWrite:false})
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.015;
  root.add(shadow);

  var ball = new THREE.Group();
  ball.position.y = 0.62;
  var ballGeo = new THREE.SphereGeometry(0.55,16,12);
  var ballMesh = new THREE.Mesh(ballGeo, new THREE.MeshBasicMaterial({color:cfg.fur}));
  ball.add(ballMesh);
  var ballOutline = new THREE.Mesh(ballGeo, new THREE.MeshBasicMaterial({color:cfg.dark,side:THREE.BackSide}));
  ballOutline.scale.setScalar(1.045);
  ball.add(ballOutline);
  [-1,1].forEach(function(side){
    var ear = new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), new THREE.MeshBasicMaterial({color:cfg.earDark?cfg.dark:cfg.fur}));
    ear.position.set(side*0.28,0.43,0);
    ball.add(ear);
    if(!cfg.earDark){
      var inner = new THREE.Mesh(new THREE.SphereGeometry(0.075,8,6), new THREE.MeshBasicMaterial({color:cfg.dark}));
      inner.position.set(side*0.28,0.45,0.09);
      ball.add(inner);
    }
    var foot = new THREE.Mesh(new THREE.SphereGeometry(0.105,10,8), new THREE.MeshBasicMaterial({color:cfg.dark}));
    foot.position.set(side*0.2,-0.44,0.08);
    ball.add(foot);
  });
  var ballTail = new THREE.Mesh(new THREE.TorusGeometry(0.1,0.028,6,16), new THREE.MeshBasicMaterial({color:cfg.dark}));
  ballTail.position.set(0,0,-0.53);
  ball.add(ballTail);
  ball.visible = false;
  root.add(ball);

  return {root:root,pivot:pivot,model:model,front:front,back:back,shadow:shadow,ball:ball,height:H,uniforms:legUniforms};
}

var bears = {};

}

function clearObjects(){
  G.obstacles.forEach(function(o){ scene.remove(o.mesh); });
  G.coinsArr.forEach(function(c){ scene.remove(c.mesh); });
  G.obstacles.length = 0;
  G.coinsArr.length = 0;

function selectChar(key){
  G.selected = key;
  document.querySelectorAll(".card").forEach(function(c){
    c.classList.toggle("selected", c.getAttribute("data-char") === key);
  });
  startBtn.disabled = false;
  startBtn.textContent = "和" + (key==="yier"?"一二":"布布") + "出发";
  Object.keys(bears).forEach(function(k){
    var b = bears[k];
    b.front.visible = true;
    b.back.visible = false;
    b.ball.visible = false;
    b.model.scale.setScalar(k===key ? 1.06 : 0.97);
  });
  initAudio(); startBgm();
  if(audioCtx) tone(660,0.1,"sine",0.07);
}

function resetRun(){
  G.time = 0; G.distance = 0; G.coins = 0; G.lives = 3;
  G.speed = 13; G.spawnT = 1.6; G.coinT = 1.2;
  G.lane = 1; G.x = 0; G.y = 0; G.vy = 0; G.jumping = false; G.pendingRoll = false;
  G.rollT = 0; G.invuln = 0; G.runT = 0;
  G.reviveUsed = false; G.reviveSkipped = false; G.shake = 0; G.flashT = 0; G.tripleLast = false;
  clearObjects();
  updateStars(); updateHud(true);
}

function startGame(){
  if(!G.selected) return;
  var key = G.selected;
  resetRun();
  Object.keys(bears).forEach(function(k){
    var b = bears[k];
    b.root.visible = k===key;
    b.root.position.set(0,0,0);
    b.root.rotation.set(0,0,0);
    b.pivot.rotation.set(0,0,0);
    b.uniforms.uSwing.value = 0;
    b.uniforms.uTuck.value = 0;
    b.pivot.position.y = b.height/2;
    b.model.rotation.set(0,0,0);
    b.model.position.set(0,0,0);
    b.model.scale.setScalar(1);
    b.front.visible = false;
    b.back.visible = true;
    b.ball.visible = false;
    b.shadow.visible = true;
  });
  menuEl.classList.add("hidden");
  overEl.classList.add("hidden");
  pauseEl.classList.add("hidden");
  reviveEl.classList.add("hidden");
  hudEl.classList.remove("hidden");
  G.state = "playing";
  setCamera("game");
  spawnRow(-58);
  spawnRow(-82);
  addCoinLine(1,-24,5,1.6,1.05);
  showToast("上滑跳跃 · 下滑翻滚 · 左右换道", 3.2);
  startBgm();
}

  overEl.classList.add("hidden");
  pauseEl.classList.add("hidden");
  reviveEl.classList.add("hidden");

    var b = bears[k];
    b.root.visible = true;
    b.root.position.set(k==="yier"?-1.1:1.1,0,-1);
    b.root.rotation.set(0,0,0);
    b.pivot.rotation.set(0,0,0);
    b.uniforms.uSwing.value = 0;
    b.uniforms.uTuck.value = 0;
    b.pivot.position.y = b.height/2;
    b.model.rotation.set(0,0,0);
    b.model.position.set(0,0,0);
    b.model.scale.setScalar(k===G.selected ? 1.06 : 1);
    b.front.visible = true;
    b.back.visible = false;
    b.ball.visible = false;
  });
  setCamera("menu");
  if(bgm.paused) startBgm();
}

function endGame(win){
  if(G.state === "over") return;
  G.state = "over";
  var score = Math.floor(G.distance) + G.coins*10;
  if(score > best){ best = score; store.set(LS_BEST, String(best)); }
  $("#overBadge").textContent = win ? "十分钟挑战完成" : "本局结束";
  $("#overTitle").textContent = win ? "通关！" : "差一点点";
  $("#overSub").textContent = win ? "一二和布布陪你跑完了全程。" : (G.reviveSkipped ? "你选择了直接结算，再来一局吧。" : (G.reviveUsed ? "复活后只有一次机会，再撞到障碍就结束了。" : "再来一次，冲过十分钟。"));
  $("#endScore").textContent = score;
  $("#endCoins").textContent = G.coins;
  $("#endDist").textContent = Math.floor(G.distance) + " m";
  var secs = Math.floor(G.time);
  $("#endTime").textContent = Math.floor(secs/60) + ":" + String(secs%60).padStart(2,"0");
  overEl.classList.remove("hidden");
  bestScoreEl.textContent = best;
  if(win) sfxWin();
  bgm.pause();
}

/* ---------------- 复活流程 ---------------- */
var reviveGapTimer = null;
var revivePlays = 0;
var reviveStarted = false;

function triggerRevive(){
  G.state = "revive";
  G.reviveUsed = true;
  G.reviveSkipped = false;
  reviveEl.classList.remove("hidden");
  reviveTitle.textContent = "星星用完了";
  reviveDesc.textContent = "看布布跳舞 3 遍可以复活，也可以直接结算。";
  reviveChoice.classList.remove("hidden");
  revivePlay.classList.add("hidden");
  reviveContinueBtn.classList.add("hidden");
  reviveContinueBtn.textContent = "继续跑！";
  reviveProgress.textContent = "第 1/3 遍播放中…";
  reviveVideo.pause();
  bgm.pause();
  revivePlays = 0;
  reviveStarted = false;
  clearTimeout(reviveGapTimer);
}

function playReviveRound(n){
  reviveProgress.textContent = "第 " + n + "/3 遍播放中…";
  reviveContinueBtn.classList.add("hidden");
  reviveVideo.muted = true;
  try{ reviveVideo.currentTime = 0; }catch(e){}
  var p = reviveVideo.play();
  if(p && p.catch) p.catch(function(){ reviveProgress.textContent = "请轻触视频继续播放"; });
}

function startReviveWatch(){
  if(G.state !== "revive" || reviveStarted) return;
  reviveStarted = true;
  reviveChoice.classList.add("hidden");
  revivePlay.classList.remove("hidden");
  reviveTitle.textContent = "看布布跳舞复活";
  reviveDesc.textContent = "完整看完 3 遍才能复活。";
  if(!reviveVideo.src) reviveVideo.src = VIDEO_SRC;
  revivePlays = 0;
  playReviveRound(1);
}

function skipRevive(){
  if(G.state !== "revive") return;
  clearTimeout(reviveGapTimer);
  reviveVideo.pause();
  reviveEl.classList.add("hidden");
  G.reviveSkipped = true;
  endGame(false);
}

function resumeFromRevive(){
  clearTimeout(reviveGapTimer);
  reviveVideo.pause();
  reviveEl.classList.add("hidden");
  reviveStarted = false;
  G.lives = 1; G.invuln = 2.2; G.y = 0; G.vy = 0; G.jumping = false; G.rollT = 0;
  G.obstacles.forEach(function(o){ if(o.z > -26){ scene.remove(o.mesh); o.dead = true; } });
  G.obstacles = G.obstacles.filter(function(o){ return !o.dead; });
  G.state = "playing";
  updateStars();
  startBgm();
  sfxRevive();
  showToast("复活成功！这一次再撞到障碍就结束", 3);
}
reviveVideo.addEventListener("ended", function(){
  if(G.state !== "revive" || !reviveStarted) return;
  revivePlays++;
  if(revivePlays < 3){
    reviveProgress.textContent = "已看完 " + revivePlays + "/3 遍，准备下一遍…";
    clearTimeout(reviveGapTimer);
    reviveGapTimer = setTimeout(function(){
      if(G.state === "revive") playReviveRound(revivePlays+1);
    }, 450);
  } else {
    reviveProgress.textContent = "3/3 遍已看完，可以复活了！";
    reviveContinueBtn.classList.remove("hidden");
  }
});
reviveVideo.addEventListener("error", function(){
  if(G.state !== "revive" || !reviveStarted) return;
  reviveProgress.textContent = "视频加载失败";
  reviveContinueBtn.textContent = "视频无法播放，直接复活";
  reviveContinueBtn.classList.remove("hidden");
});
reviveVideo.addEventListener("click", function(){
  reviveVideo.muted = !reviveVideo.muted;
  if(!reviveVideo.muted && reviveVideo.paused) reviveVideo.play().catch(function(){});
});

/* ---------------- 玩家动作 ---------------- */
function doJump(){
  if(G.state !== "playing") return;
  if(G.rollT > 0){ G.rollT = 0; }
  if(G.jumping) return;
  G.jumping = true; G.vy = 9.2;
  sfxJump();
}
function doRoll(){
  if(G.state !== "playing") return;
  if(G.jumping){ G.vy = Math.min(G.vy, -15); G.pendingRoll = true; }
  else if(G.rollT <= 0){ G.rollT = 0.72; sfxRoll(); }
}
function changeLane(delta){
  if(G.state !== "playing") return;
  var next = clamp(G.lane + delta, 0, 2);
  if(next !== G.lane){ G.lane = next; sfxRoll(); }
}

/* ---------------- 生成器 ---------------- */
function addObstacle(kind,lane,z){
  var mesh;
  if(kind === "jump") mesh = makeJumpBarrier();
  else if(kind === "roll") mesh = makeOverhead();
  else mesh = makeBlock();
  mesh.position.set(LANES[lane],0,z);
  scene.add(mesh);
  G.obstacles.push({mesh:mesh, kind:kind, lane:lane, z:z, hit:false});
}
function addCoin(lane,z,y){
  var mesh = makeCoin();
  mesh.position.set(LANES[lane], y, z);
  scene.add(mesh);
  G.coinsArr.push({mesh:mesh, lane:lane, z:z, y:y, dead:false, spin:rand(0,6)});
}
function addCoinLine(lane,z,count,gap,y){
  for(var i=0;i<count;i++) addCoin(lane, z - i*(gap||1.7), y||1.05);
}
function addCoinArc(lane,z){
  for(var i=0;i<5;i++){
    var t = i/4;
    addCoin(lane, z + 2.6 - i*1.3, 1.0 + Math.sin(t*Math.PI)*1.15);
  }
}
function spawnRow(zBase){
  var z = typeof zBase === "number" ? zBase : -96;
  var p = Math.min(1, G.time/360);
  G.tripleLast = false;
  if(p > 0.5 && Math.random() < 0.1 + (p-0.5)*0.12){
    var kindAll = Math.random() < 0.6 ? "jump" : "roll";
    for(var l0=0;l0<3;l0++) addObstacle(kindAll,l0,z + rand(-0.25,0.25));
    if(kindAll === "jump") addCoinArc(1,z);
    G.tripleLast = true;
    return;
  }
  var n = Math.random() < Math.max(0.2, 0.56 - p*0.34) ? 1 : 2;
  var lanes = [0,1,2];
  for(var i=lanes.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var tmp=lanes[i]; lanes[i]=lanes[j]; lanes[j]=tmp; }
  var chosen = lanes.slice(0,n);
  var free = lanes.slice(n);
  var kinds = [];
  chosen.forEach(function(lane){
    var r = Math.random();
    var kind = r < 0.42 ? "jump" : (r < 0.78 ? "block" : "roll");
    kinds.push(kind);
    addObstacle(kind,lane,z + rand(-0.4,0.4));
  });
  var coinLane = pick(free);
  addCoinLine(coinLane, z + 1.5, 5, 1.7, 1.05);
  if(n === 1 && kinds[0] === "jump" && Math.random() < 0.45){
    addCoinArc(chosen[0], z);
  }
}
function spawnCoinOnly(){
  var lane = (Math.random()*3)|0;
  addCoinLine(lane, -99, 6, 1.55, 1.05);
}

/* ---------------- HUD ---------------- */
var lastHud = 0;
function updateStars(){
  var html = "";
  for(var i=0;i<3;i++) html += '<span class="' + (i < G.lives ? "" : "off") + '">★</span>';
  starsEl.innerHTML = html;
}
function updateHud(force){
  var now = performance.now();
  if(!force && now - lastHud < 100) return;
  lastHud = now;
  coinCountEl.textContent = G.coins;
  scoreValEl.textContent = Math.floor(G.distance) + G.coins*10;
  var left = Math.max(0, GAME_TIME - G.time);
  var mm = Math.floor(left/60), ss = Math.floor(left%60);
  timeTextEl.textContent = mm + ":" + String(ss).padStart(2,"0");
  timeFillEl.style.width = (G.time/GAME_TIME*100).toFixed(1) + "%";
}
var toastTimer = null;
function showToast(text, secs){
  toastEl.textContent = text;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, (secs||2.5)*1000);
}
function flashScreen(){
  flashEl.classList.add("on");
  setTimeout(function(){ flashEl.classList.remove("on"); }, 120);
}

/* ---------------- 碰撞 ---------------- */
function takeHit(){
  if(G.invuln > 0 || G.state !== "playing") return;
  G.lives--;
  updateStars();
  G.invuln = 1.3;
  G.shake = 0.5;
  flashScreen();
  sfxHit();
  if(G.lives <= 0){
    if(!G.reviveUsed) triggerRevive();
    else endGame(false);
  }
}

/* ---------------- 主循环 ---------------- */
var lastTime = performance.now();
var menuT = 0;
var fpsAcc = 0, fpsCount = 0, fpsLow = 0;

function animateBearMenu(b,t){
  var phase = b===bears.yier ? 0 : 1.7;
  b.model.position.y = Math.sin(t*1.9 + phase)*0.045;
  b.model.rotation.set(0,0,Math.sin(t*0.8 + phase)*0.025);
  b.uniforms.uSwing.value = Math.sin(t*3.2 + phase)*0.22;
  b.uniforms.uTuck.value = 0;
}

function updateEnvironment(dt){
  var speed = G.state === "playing" ? G.speed : 0;
  if(speed <= 0) return;
  var dummy = env.dummy;
  for(var i=0;i<env.sleeperZ.length;i++){
    env.sleeperZ[i] += speed*dt;
    if(env.sleeperZ[i] > 15) env.sleeperZ[i] -= env.sleeperZ.length*2.4;
    dummy.rotation.set(0,0,0);
    dummy.scale.set(1,1,1);
    dummy.position.set(0,0.07,env.sleeperZ[i]);
    dummy.updateMatrix();
    env.sleepers.setMatrixAt(i,dummy.matrix);
  }
  env.sleepers.instanceMatrix.needsUpdate = true;

  env.fenceData.forEach(function(f){
    f.z += speed*dt;
    if(f.z > 18) f.z -= 160;
  });
  refreshFence();

  env.trees.forEach(function(t){
    t.z += speed*dt;
    if(t.z > 20){
      t.z -= 192;
      t.x = (t.x < 0 ? -1 : 1) * rand(4.4,8.2);
      t.s = rand(0.8,1.35);
    }
  });
  refreshTrees();

  env.bushData.forEach(function(b){
    b.z += speed*dt;
    if(b.z > 16) b.z -= 190;
  });
  refreshBushes();

  env.flowerData.forEach(function(f){
    f.z += speed*dt;
    if(f.z > 16) f.z -= 200;
  });
  refreshFlowers();

  env.clouds.forEach(function(c){
    c.position.z += speed*dt*0.05;
    if(c.position.z > 14){
      c.position.z -= 142;
      c.position.x = rand(-24,24);
    }
  });
}

function updatePlayer(dt){
  var targetX = LANES[G.lane];
  G.x = lerp(G.x, targetX, clamp(dt*11,0,1));
  if(G.jumping){
    G.vy -= 26*dt;
    G.y += G.vy*dt;
    if(G.y <= 0){
      G.y = 0; G.vy = 0; G.jumping = false;
      if(G.pendingRoll){ G.pendingRoll = false; G.rollT = 0.72; sfxRoll(); }
    }
  }
  if(G.rollT > 0){
    G.rollT -= dt;
    if(G.rollT <= 0){ G.rollT = 0; }
  }
  if(G.invuln > 0) G.invuln -= dt;

  var b = bears[G.selected];
  if(!b) return;
  b.root.position.x = G.x;
  b.root.position.y = G.y;
  b.shadow.position.y = 0.015 - G.y;
  b.shadow.scale.setScalar(clamp(1 - G.y*0.22,0.45,1));
  b.shadow.material.opacity = clamp(0.28 - G.y*0.06,0.06,0.28);

  G.runT += dt * (4 + G.speed*0.32);
  var bob = Math.abs(Math.sin(G.runT))*0.07;

  if(G.rollT > 0){
    var rp = 1 - G.rollT/0.72;
    b.uniforms.uSwing.value = 0;
    b.uniforms.uTuck.value = 1;
    b.root.position.z = -Math.sin(rp*Math.PI)*0.35;
    if(rp < 0.16 || rp > 0.84){
      var tuck = rp < 0.16 ? rp/0.16 : (1-rp)/0.16;
      var sy = 1 - 0.32*tuck;
      b.front.visible = false;
      b.back.visible = true;
      b.ball.visible = false;
      b.pivot.rotation.set(0,0,0);
      b.pivot.position.y = (b.height/2)*sy;
      b.model.position.y = 0;
      b.model.rotation.set(0,0,0);
      b.model.scale.set(1,sy,1);
    } else {
      b.front.visible = false;
      b.back.visible = false;
      b.ball.visible = true;
      var bs = Math.min((rp-0.16)/0.08, (0.84-rp)/0.08, 1);
      b.ball.scale.setScalar(clamp(bs,0.2,1));
      b.ball.rotation.x = -rp * Math.PI * 2;
      b.pivot.rotation.set(0,0,0);
      b.pivot.position.y = b.height/2;
      b.model.position.y = 0;
      b.model.rotation.set(0,0,0);
      b.model.scale.set(1,1,1);
    }
  } else {
    b.root.position.z = 0;
    b.front.visible = false;
    b.back.visible = true;
    b.ball.visible = false;
    b.uniforms.uSwing.value = G.jumping ? 0 : Math.sin(G.runT*2.2);
    b.uniforms.uTuck.value = G.jumping ? 1 : 0;
    b.pivot.rotation.set(0,0,0);
    b.pivot.position.y = b.height/2;
    b.model.position.y = (G.jumping ? 0 : bob);
    b.model.rotation.z = clamp((targetX - G.x)*0.12,-0.2,0.2);
    b.model.scale.set(G.jumping?0.96:1, G.jumping?1.04:1, 1);
  }

  b.root.visible = !(G.invuln > 0 && Math.floor(G.invuln*12)%2 === 0);
}

function updateWorld(dt){
  var p = G.time/360;
  var ramp = clamp(p,0,1);
  G.speed = Math.min(42, 13 + 23*Math.pow(clamp(p,0,1.5),0.62));
  G.distance += G.speed*dt;
  G.time += dt;
  if(G.time >= GAME_TIME){ endGame(true); return; }

  var interval = lerp(1.35, 0.5, Math.pow(ramp,0.7));
  if(p > 1) interval = Math.max(0.38, interval - (p-1)*0.12);
  G.spawnT -= dt;
  if(G.spawnT <= 0){ spawnRow(); G.spawnT = interval + (G.tripleLast ? 0.35 : 0); }
  G.coinT -= dt;
  if(G.coinT <= 0){ spawnCoinOnly(); G.coinT = lerp(1.8,0.9,ramp); }

  var i, o, c;
  for(i=G.obstacles.length-1;i>=0;i--){
    o = G.obstacles[i];
    o.z += G.speed*dt;
    o.mesh.position.z = o.z;
    if(o.z > 14){
      scene.remove(o.mesh);
      G.obstacles.splice(i,1);
      continue;
    }
    if(!o.hit && Math.abs(o.z) < 0.95 && Math.abs(G.x - LANES[o.lane]) < 1.05 && G.invuln <= 0){
      var hit = false;
      if(o.kind === "jump") hit = G.y < 0.82;
      else if(o.kind === "roll") hit = G.rollT <= 0;
      else hit = true;
      if(hit){
        o.hit = true;
        takeHit();
        if(G.state !== "playing") break;
      }
    }
  }
  if(G.state !== "playing") return;

  for(i=G.coinsArr.length-1;i>=0;i--){
    c = G.coinsArr[i];
    c.z += G.speed*dt;
    c.mesh.position.z = c.z;
    c.spin += dt*5;
    c.mesh.rotation.y = c.spin;
    if(c.z > 12){
      scene.remove(c.mesh);
      G.coinsArr.splice(i,1);
      continue;
    }
    if(Math.abs(c.z) < 0.9 && Math.abs(G.x - LANES[c.lane]) < 1.0 && Math.abs((G.y+1.0) - c.y) < 1.1){
      G.coins++;
      sfxCoin();
      scene.remove(c.mesh);
      G.coinsArr.splice(i,1);
      coinCountEl.textContent = G.coins;
    }
  }
}

function updateCamera(dt){
  var targetX = G.state === "menu" ? 0 : G.x*0.55;
  camera.position.x = lerp(camera.position.x, targetX, clamp(dt*6,0,1));
  camLook.x = G.state === "menu" ? 0 : G.x*0.18;
  if(G.state === "playing" || G.state === "revive"){
    camera.position.y = CAM_GAME.pos.y + Math.sin(G.runT*0.9)*0.025;
    camera.lookAt(camLook);
  }
  if(G.shake > 0){
    G.shake = Math.max(0, G.shake - dt*1.8);
    camera.position.x += rand(-1,1)*G.shake*0.45;
    camera.position.y += rand(-1,1)*G.shake*0.35;
  }
}

function frame(now){
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (now - lastTime)/1000);
  lastTime = now;

  if(G.state === "menu"){
    menuT += dt;
    animateBearMenu(bears.yier, menuT);
    animateBearMenu(bears.bubu, menuT);
  } else if(G.state === "playing"){
    updateWorld(dt);
    if(G.state === "playing"){
      updatePlayer(dt);
      updateEnvironment(dt);
      updateHud(false);
    }
    updateCamera(dt);
  } else if(G.state === "revive"){
    updateCamera(dt);
  } else if(G.state === "paused" || G.state === "over"){
    updateCamera(dt);
  }

  renderer.render(scene,camera);

  fpsAcc += dt; fpsCount++;
  if(fpsAcc > 2){
    var fps = fpsCount/fpsAcc;
    if(fps < 38 && renderer.getPixelRatio() > 1.05){ fpsLow++; if(fpsLow >= 2){ renderer.setPixelRatio(1); } }
    fpsAcc = 0; fpsCount = 0;
  }
}

/* ---------------- 输入 ---------------- */
var touch = {x:0,y:0,t:0,active:false};
function onTouchStart(e){
  if(e.target.closest && e.target.closest(".overlay,button,.card")) return;
  var t = e.changedTouches ? e.changedTouches[0] : e;
  touch.x = t.clientX; touch.y = t.clientY; touch.t = performance.now(); touch.active = true;
}
function onTouchMove(e){
  if(touch.active) e.preventDefault();
}
function onTouchEnd(e){
  if(!touch.active) return;
  touch.active = false;
  var t = e.changedTouches ? e.changedTouches[0] : e;
  var dx = t.clientX - touch.x;
  var dy = t.clientY - touch.y;
  var ax = Math.abs(dx), ay = Math.abs(dy);
  var threshold = Math.max(22, Math.min(window.innerWidth,window.innerHeight)*0.045);
  if(Math.max(ax,ay) < threshold) return;
  if(ax > ay){
    changeLane(dx > 0 ? 1 : -1);
  } else {
    if(dy < 0) doJump(); else doRoll();
  }
}
canvas.addEventListener("touchstart", onTouchStart, {passive:true});
canvas.addEventListener("touchmove", onTouchMove, {passive:false});
canvas.addEventListener("touchend", onTouchEnd);
canvas.addEventListener("touchcancel", function(){ touch.active = false; });

window.addEventListener("keydown", function(e){
  if(G.state !== "playing") return;
  if(e.key === "ArrowUp" || e.key === " "){ e.preventDefault(); doJump(); }
  else if(e.key === "ArrowDown"){ e.preventDefault(); doRoll(); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); changeLane(-1); }
  else if(e.key === "ArrowRight"){ e.preventDefault(); changeLane(1); }
});

/* 鼠标拖动，方便电脑测试 */
var mouseDown = false, mx = 0, my = 0;
canvas.addEventListener("mousedown", function(e){ mouseDown = true; mx = e.clientX; my = e.clientY; });
window.addEventListener("mouseup", function(e){
  if(!mouseDown) return;
  mouseDown = false;
  var dx = e.clientX - mx, dy = e.clientY - my;
  var ax = Math.abs(dx), ay = Math.abs(dy);
  if(Math.max(ax,ay) < 30) return;
  if(ax > ay) changeLane(dx > 0 ? 1 : -1);
  else if(dy < 0) doJump(); else doRoll();
});

/* ---------------- 自适应 ---------------- */
function resize(){
  var w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", function(){ setTimeout(resize,120); });

/* ---------------- 启动 ---------------- */
buildEnvironment();
buildBears();
setCamera("menu");
resize();
applyMute();
updateStars();
requestAnimationFrame(frame);

if(location.hash === "#debug"){
  window.__game = {G:G,startGame:startGame,triggerRevive:triggerRevive,resume:resumeFromRevive,endGame:endGame,bgm:bgm,renderer:renderer};
}

})();
</script>
